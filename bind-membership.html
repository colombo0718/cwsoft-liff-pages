<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>綁定會員</title>

  <!-- 你已移除 <style>：只用外部 CSS -->
  <link rel="stylesheet" href="./style.css?v=dev2" />

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    section[aria-label="綁定送出"] > div > .btn{
      flex: 1 1 auto;
      width: 100%;
    }
  </style>
</head>

<body>  


  <section class="card" aria-label="綁定會員">
    <header>
      <h2>綁定會員</h2>
    </header>

    <form id="member-form" autocomplete="off">
      <!-- 基本資料 -->
      <fieldset>
        <legend>👤 基本資料</legend>
        <p id="member-form-hint" class="hint">請填寫會員資料</p>

        <label>
          <!-- <h4 class="required">姓名*</h4> -->
          <h4>姓名</h4>
          <div>
            <input id="name" type="text" placeholder="例如：趙士豪" />
          </div>
        </label>

        <label>
          <!-- <h4 class="required">手機*</h4> -->
          <h4>手機</h4>
          <div>
            <input id="phone" type="tel" placeholder="例如：0912-345-678" />
          </div>
        </label>

        <label>
          <h4>地址</h4>

          <div>
            <select id="addrCity">
              <option value="">選擇縣市</option>
            </select>

            <select id="addrDistrict" disabled>
              <option value="">選擇區域</option>
            </select>
          </div>

          <input id="address" type="hidden" value="" />
        </label>
      </fieldset>

      <!-- 安全驗證 -->
      <fieldset>
        <legend>🛡️ 安全驗證</legend>
        <p class="hint">請完成安全驗證</p>

        <section aria-label="圖片驗證">
          <h4>圖片</h4>
          <div>
            <button type="button" class="btn" id="btn-captcha-refresh" aria-label="刷新圖片驗證">🔃</button>
            <canvas id="captchaCanvas" width="170" height="50"></canvas>
            <input
              id="captchaInput"
              type="text"
              inputmode="numeric"
              placeholder="輸入左側圖片數字"
              maxlength="4"
            />
          </div>
        </section>

        <section aria-label="簡訊驗證">
          <h4>簡訊</h4>
          <div>
            <button type="button" class="btn" id="btn-otp-send">取得簡訊驗證碼</button>
            <input
              id="otpInput"
              type="text"
              inputmode="numeric"
              placeholder="輸入 6 位 OTP"
              maxlength="6"
            />
          </div>
        </section>


        <section aria-label="綁定送出">
          <h4>綁定</h4>
          <div>
            <button type="submit" class="btn" id="btn-submit" disabled>
              <span>送出資料</span>
            </button>
          </div>
        </section>
      </fieldset>

      <!-- 送出 -->
      <footer>
        <!-- <button type="submit" class="btn" id="btn-submit" disabled>
          <span>送出資料</span>
        </button> -->

        <output id="status" aria-live="polite" hidden></output>
      </footer>

      <!-- Debug -->
      <details hidden>
        <summary>Debug（工程用）</summary>
        <pre id="debug">[debug] boot...</pre>
      </details>
    </form>
  </section>



  <script src="./core.js?ts=<?=Date.now()?"></script>
  <script src="./captcha.js?ts=<?=Date.now()?"></script>
  <script>
    // ====== Config ======
    const LIFF_ID_DEFAULT = "2008039127-p7We0QWm"; // 你的 LIFF ID
    // const LIFF_ID_DEFAULT = "2008039127-VV7xY5jY"; // 測試用 LIFF ID
    
    const API_OTP       = "https://cwsoft.leaflune.org/otp";
    const API_BIND      = "https://cwsoft.leaflune.org/bind";

    // 先求有：你之後會換成後端的一次性 token
    let checkToken = "DUMMY_TOKEN";


    function getParam(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    // ====== Main init ======
    async function initAll() {
      dbg("init start");

      // 1) oaid
      oaid = getOaIdFromUrl();
      dbg(`oaid=${oaid || "(empty)"}`);

      // 2) lookup db
      await lookupDbNameByOaId(oaid);

      // 3) init LIFF

      const LIFF_ID = getParam("liffId") || LIFF_ID_DEFAULT;
      try {
        console.log(LIFF_ID)
        await liff.init({ liffId: LIFF_ID });
        liffReady = true;
        dbg("LIFF：已初始化");
      } catch (e) {
        dbg(`LIFF init failed: ${e?.message || e}`);
        setStatus("LIFF 初始化失敗，請確認 LIFF ID/網路狀態", "error");
        refreshSubmitState();
        return;
      }

      // 4) login check
      if (!liff.isLoggedIn()) {
        dbg("Line：未登入 -> redirect login");
        setStatus("尚未登入 Line，準備跳轉登入…");
        liff.login();
        return;
      }
      dbg("Line：已登入");

      // 5) get profile
      try {
        liffProfile = await liff.getProfile();
        dbg(`profile ok: displayName=${liffProfile.displayName}, uid=${liffProfile.userId}`);
        autofillNameFromLineProfile();
        refreshSubmitState(); // 填入後順便更新送出按鈕狀態
      } catch (e) {
        dbg(`getProfile failed: ${e?.message || e}`);
        setStatus("取得使用者資訊失敗", "error");
        refreshSubmitState();
        return;
      }

      // 6) check bind
      try {
        const data = await checkIsBindMember(oaid, liffProfile.userId);
        if (!data.ok) throw new Error(data.error || "is_bind not ok");

        isBound = !!data.is_bound;
        memberNo = data.member_no ?? null;
        bindId = data.bind_id ?? null;

        if (isBound) {
          dbg(`Bind：已綁定 (member_no=${memberNo ?? "null"}, bind_id=${bindId ?? "null"})`);
          setStatus("此帳號已綁定會員，表單已鎖定。", "success");
          memberFormHintEl.textContent = "您已綁定過會員資料，表單已鎖定。";
          lockAllUI();
        } else {
          dbg("Bind：未綁定");
          setStatus("");
        }
      } catch (e) {
        dbg(`is_bind failed: ${e?.message || e}`);
        setStatus("查詢綁定狀態失敗（請稍後重試）", "error");
      }

      // 7) init captcha/otp
      resetCaptcha();
      resetOtp();
      initAddressDropdown(); // 地址下拉選單初始化

      // 8) wire input events
      [nameInput, phoneInput].forEach(el => el.addEventListener("input", refreshSubmitState));
      captchaInput.addEventListener("input", refreshSubmitState);


      refreshSubmitState();
      dbg("init done");
    }

    // ====== Events ======
    btnCaptchaRefresh.addEventListener("click", () => resetCaptcha());

    // btnCaptchaVerify.addEventListener("click", () => {
    //   const v = (captchaInput.value || "").trim();
    //   if (v === captchaCode) {
    //     captchaVerified = true;
    //     dbg("CAPTCHA：驗證成功");
    //     // setInline(captchaVerifyStatus, "驗證成功", "ok");
    //   } else {
    //     captchaVerified = false;
    //     dbg(`CAPTCHA：驗證失敗 (input=${v || "empty"})`);
    //     // setInline(captchaVerifyStatus, "驗證失敗", "bad");
    //     // 可選：失敗就換一張，降低暴力嘗試
    //     resetCaptcha();
    //   }
    //   refreshSubmitState();
    // });
function verifyCaptchaNow() {
  const v = (captchaInput.value || "").trim();
  if (v === captchaCode) {
    captchaVerified = true;
    dbg("CAPTCHA：驗證成功");
    // setInline(captchaVerifyStatus, "驗證成功", "ok");
  } else {
    captchaVerified = false;
    dbg(`CAPTCHA：驗證失敗 (input=${v || "empty"})`);
    // setInline(captchaVerifyStatus, "驗證失敗", "bad");
    // 可選：失敗就換一張，降低暴力嘗試
    resetCaptcha();
  }
  refreshSubmitState();
}

captchaInput.addEventListener("input", () => {
  // 只留數字（避免使用者輸入空白或其他字元）
  const digits = (captchaInput.value || "").replace(/\D/g, "").slice(0, 4);

  // 如果有清掉非數字，就回寫（保持 UI 一致）
  if (captchaInput.value !== digits) captchaInput.value = digits;

  // 未滿 4 碼：視為尚未驗證
  if (digits.length < 4) {
    captchaVerified = false;
    refreshSubmitState();
    return;
  }

  // 剛好 4 碼：自動驗證
  verifyCaptchaNow();
});

btnOtpSend.addEventListener("click", async () => {
  // setInline(otpSendStatus, "發送中…", "");
  dbg("OTP：send request...");

  const lineOAID = (oaid || "").trim();
  const phone = normalizePhone(phoneInput.value);
  const db_name = (dbName || "").trim();   // ✅ 新增

  try {
    const url = new URL(`${API_OTP}/send`);
    url.searchParams.set("lineOAID", lineOAID);
    url.searchParams.set("phone", phone);
    url.searchParams.set("db_name", db_name); // ✅ 新增
    console.log(db_name,phone)
    const res = await fetch(url.toString(), {
      method: "GET",
      mode: "cors",
      cache: "no-store",
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    console.log("otp send resp:", data);

    // setInline(otpSendStatus, "已發送（先求有）", "ok");
    dbg("OTP：send ok");
  } catch (e) {
    // setInline(otpSendStatus, "發送失敗", "bad");
    dbg(`OTP：send failed: ${e?.message || e}`);
  }
});


      otpInput.addEventListener("input", () => {

        const digits = (otpInput.value || "").replace(/\D/g, "").slice(0, 6);
        
        if (otpInput.value !== digits) otpInput.value = digits;
        // console.log(digits)
        console.log(canSubmit())
        refreshSubmitState();
      });


form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!canSubmit()) {
    dbg("submit blocked: canSubmit=false");
    setStatus("條件尚未完成，無法送出。", "error");
    return;
  }

  const phone = normalizePhone(phoneInput.value);
  const otp = (otpInput.value || "").trim();

  try {
    setStatus("驗證 OTP 中…", "");

    // ✅ Step 1：送出時才做 OTP check
    const urlCheck = new URL(`${API_OTP}/check`);
    urlCheck.searchParams.set("phone", phone);
    urlCheck.searchParams.set("otp", otp);

    const resCheck = await fetch(urlCheck.toString(), {
      method: "GET",
      mode: "cors",
      cache: "no-store",
    });

    const dataCheck = await resCheck.json().catch(() => ({}));
    dbg("OTP：check resp:");
    dbg(JSON.stringify(dataCheck));

    if (!resCheck.ok || !dataCheck?.ok) {
      const err = dataCheck?.error || `HTTP ${resCheck.status}`;
      dbg(`OTP：check failed: ${err}`);

      // 你原本的錯誤文案我沿用（先求有）
      if (String(err).includes("expired")) {
        setStatus("驗證失敗：驗證碼已過期，請重新取得", "error");
      } else if (String(err).includes("mismatch")) {
        setStatus("驗證失敗：驗證碼不正確", "error");
      } else if (String(err).includes("no otp record")) {
        setStatus("驗證失敗：請先取得驗證碼", "error");
      } else {
        setStatus("驗證失敗", "error");
      }
      return;
    }

    // ✅ 成功：拿 check_token
    checkToken = dataCheck.check_token || "";
    if (!checkToken) {
      dbg("OTP：check ok but missing check_token");
      setStatus("驗證失敗：未取得 token", "error");
      return;
    }

    // ✅ Step 2：OTP OK 後才送 bind
    setStatus("送出中…", "");

    const urlBind = new URL(`${API_BIND}/submit`);
    urlBind.searchParams.set("lineOAID", oaid);
    urlBind.searchParams.set("lineUid", liffProfile?.userId || "");
    urlBind.searchParams.set("name", nameInput.value.trim());
    urlBind.searchParams.set("phone", phone);
    urlBind.searchParams.set("check_token", checkToken);

    const res = await fetch(urlBind.toString(), {
      method: "GET",
      mode: "cors",
      cache: "no-store",
    });

    const data = await res.json().catch(() => null);

    if (!res.ok) {
      dbg("bind failed resp:");
      dbg(JSON.stringify(data));
      throw new Error(`HTTP ${res.status}`);
    }

    dbg("bind ok resp:");
    dbg(JSON.stringify(data));
    setStatus("綁定送出成功（先求有）", "success");
  } catch (err) {
    setStatus(`綁定送出失敗：${err?.message || err}`, "error");
  }
});

    // Boot
    initAll();
  </script>
</body>
</html>
