<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>門市導覽</title>

  <!-- 沿用同一套風格 -->
  <link rel="stylesheet" href="./style.css" />

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
.list{
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 14px;
}

.item.item-left{
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 16px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 8px 24px rgba(0,0,0,.08);
  text-align: left;
}

.item-left .store-name{
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
}

.item-left .addr{
  margin: 0;
  font-size: 18px;
  line-height: 1.5;
  color: #555;
  word-break: break-word;
}

.item-left .btn-go{
  justify-self: start;
  min-width: 120px;
  padding: 12px 18px;
  border: 0;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 700;
  background: #f7b500;
  color: #fff;
  cursor: pointer;
}
  </style>
</head>

<body>
  <section class="card">
    <header class="topline">
      <h2 id="pageTitle" style="margin:0;">🏬 門市導覽</h2>
      <span class="badge" id="badge"></span>
    </header>

    <p class="hint" id="hint">讀取中…</p>
    <output id="status" aria-live="polite"></output>

    <div class="list" id="list"></div>

    <!-- <footer style="margin-top:10px;">
      <button type="button" id="btn-close" class="btn">關閉</button>
    </footer> -->

    <details style="margin-top:10px;"hidden>
      <summary>Debug（工程用）</summary>
      <pre id="debug">[debug] boot.</pre>
    </details>
  </section>

<script>
  // ===== Config =====
  const API_BIND = "https://cwsoft.leaflune.org/bind";
  const LIFF_ID_DEFAULT = "2008039127-F5GTH4WZ"; // 你可沿用既有預設

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const pageTitleEl = $("pageTitle");
  const hintEl = $("hint");
  const statusEl = $("status");
  const listEl = $("list");
  const badgeEl = $("badge");
  const debugEl = $("debug");
  
//   const btnClose = $("btn-close");

  function dbg(line){
    const t = new Date().toISOString().slice(11,19);
    debugEl.textContent += `\n[${t}] ${line}`;
    debugEl.scrollTop = debugEl.scrollHeight;
  }
  function setStatus(text, type){
    statusEl.className = "status" + (type ? " " + type : "");
    statusEl.textContent = text || "";
  }
  function getParam(name){
    return new URLSearchParams(location.search).get(name) || "";
  }

  function mapsUrlByAddress(addr){
    const q = encodeURIComponent(addr);
    return `https://www.google.com/maps/search/?api=1&query=${q}`;
  }

function render(items, dbName){
  listEl.innerHTML = "";
  if (!items.length){
    hintEl.textContent = "查無可用門市（可能都已收店 / 線上付款停用）。";
    return;
  }
  hintEl.textContent = "快速查看各門市位置，點擊即可開啟導航。";

  for (const it of items){
    const itemEl = document.createElement("article");
    itemEl.className = "item item-left";

    const rawAddress = String(it.address || "").trim();
    const displayAddress = rawAddress.length < 5
      ? `${dbName}${it.store_name || ""}`
      : rawAddress;

    const btnGo = document.createElement("button");
    btnGo.type = "button";
    btnGo.className = "btn-go";
    btnGo.textContent = "🚗前往";
    btnGo.addEventListener("click", () => {
      const url = mapsUrlByAddress(displayAddress || it.store_name || "");
      dbg(`open map: ${url}`);
      window.open(url, "_blank");
    });

    const title = document.createElement("h3");
    title.className = "store-name";
    title.textContent = it.store_name || "(未命名門市)";

    const addr = document.createElement("p");
    addr.className = "addr";
    addr.textContent = displayAddress || "(未提供地址)";

    itemEl.appendChild(btnGo);
    itemEl.appendChild(title);
    itemEl.appendChild(addr);

    listEl.appendChild(itemEl);
  }
}

  async function fetchStores(dbName){
    const url = new URL(`${API_BIND}/branches`);
    url.searchParams.set("name", dbName);

    dbg(`fetch: ${url.toString()}`);
    const res = await fetch(url.toString(), { method:"GET", mode:"cors", cache:"no-store" });
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data?.ok){
      throw new Error(data?.error || `HTTP ${res.status}`);
    }
    return data;
  }

  async function init(){
    dbg("init start");

    // 1) db name
    const dbName = (getParam("name") || "").trim();
    pageTitleEl.textContent = dbName ? `🏬 ${dbName} 門市導覽` : "🏬 門市導覽";
    badgeEl.textContent = "";

    if (!dbName){
      hintEl.textContent = "網址缺少 name（資料庫名）。";
      setStatus("請使用 ?name=久旺 的形式開啟", "error");
      return;
    }

    // 2) init LIFF
    const LIFF_ID = getParam("liffId") || LIFF_ID_DEFAULT;
    try{
      await liff.init({ liffId: LIFF_ID });
      dbg("LIFF ok");
    }catch(e){
      dbg(`LIFF init failed: ${e?.message || e}`);
      setStatus("LIFF 初始化失敗", "error");
      return;
    }

    if (!liff.isLoggedIn()){
      dbg("not logged in -> login()");
      setStatus("尚未登入 Line，準備跳轉登入…");
      liff.login();
      return;
    }

    // 3) load stores
    try{
      setStatus("讀取門市中…");
      const data = await fetchStores(dbName);
      dbg(`stores ok: count=${data.count}`);
      setStatus("");
      render(data.items || [],dbName);
    }catch(e){
      dbg(`stores failed: ${e?.message || e}`);
      setStatus(`讀取失敗：${e?.message || e}`, "error");
      hintEl.textContent = "讀取門市清單失敗。";
    }
  }



  init();
</script>
</body>
</html>
